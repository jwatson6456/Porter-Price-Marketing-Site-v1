name: Update NVDA price
on:
  schedule:
    # ~every 15 min during US market hours (times are UTC; nudge the hour range ±1 for DST)
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch: {}      # lets you run it manually from the Actions tab
jobs:
  price:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch NVDA price from Fiscal.ai
        env:
          FISCAL_API_KEY: ${{ secrets.FISCAL_API_KEY }}
        run: |
          resp=$(curl -s "https://api.fiscal.ai/v1/company/stock-prices/intraday?companyKey=NASDAQ_NVDA&apiKey=$FISCAL_API_KEY")
          echo "Raw response (first 500 chars): ${resp:0:500}"
          price=$(printf '%s' "$resp" | jq -r '
            def pick: (.price // .close // .last // .value // .c // .adjClose // empty);
            (if type=="array" then .[-1]
             elif (type=="object" and has("data")   and (.data|type)=="array")   then .data[-1]
             elif (type=="object" and has("data"))   then .data
             elif (type=="object" and has("prices") and (.prices|type)=="array") then .prices[-1]
             elif (type=="object" and has("prices")) then .prices
             else . end) | pick
          ' 2>/dev/null || true)
          if [ -z "$price" ] || [ "$price" = "null" ]; then
            echo "Could not parse a price. Full raw response below (price data only, no key):"
            printf '%s\n' "$resp"
            exit 1
          fi
          echo "{\"price\": $price, \"updated\": \"$(date -u +%FT%TZ)\"}" > price.json
          echo "Wrote price.json: $(cat price.json)"
      - name: Commit price.json if it changed
        run: |
          git config user.name  "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price.json
          git diff --staged --quiet || (git commit -m "price update" && git push)

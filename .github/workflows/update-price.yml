name: Update NVDA price
on:
  schedule:
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch: {}
jobs:
  price:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch NVDA price from Fiscal.ai
        env:
          FISCAL_API_KEY: ${{ secrets.FISCAL_API_KEY }}
        run: |
          resp=$(curl -s "https://api.fiscal.ai/v1/company/stock-prices/intraday?companyKey=NASDAQ_NVDA&apiKey=$FISCAL_API_KEY")
          echo "Raw response (first 800 chars): ${resp:0:800}"
          arr=$(printf '%s' "$resp" | jq -c 'if type=="array" then . elif (type=="object" and (.data|type)=="array") then .data elif (type=="object" and (.prices|type)=="array") then .prices else [.] end' 2>/dev/null || echo "[]")
          picked=$(printf '%s' "$arr" | jq -c 'max_by(.datetime // .date // .timestamp // .time // .t // "")' 2>/dev/null || echo "null")
          echo "Newest point: $picked"
          price=$(printf '%s' "$picked" | jq -r '(.price // .close // .last // .c // .value // .adjClose // empty)' 2>/dev/null || true)
          if [ -z "$price" ] || [ "$price" = "null" ]; then
            echo "Could not parse a price. Full raw response below (price data only, no key):"
            printf '%s\n' "$resp"
            exit 1
          fi
          echo "{\"price\": $price, \"updated\": \"$(date -u +%FT%TZ)\"}" > price.json
          echo "Wrote price.json: $(cat price.json)"
      - name: Commit price.json if it changed
        run: |
          git config user.name  "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price.json
          git diff --staged --quiet || (git commit -m "price update" && git push)
